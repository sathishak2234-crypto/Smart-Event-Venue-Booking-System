<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Smart Event Venue Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="profile.html">
                <i class="fas fa-building me-2"></i> Smart Venue Booking
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="venues.html">Venues</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Feedback Section -->
    <section class="feedback-section py-5">
        <div class="container">
            <h1 class="mb-4">Submit Feedback</h1>

            <div class="row">
                <!-- Feedback Form -->
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5>Share Your Experience</h5>
                        </div>
                        <div class="card-body">
                            <form id="feedbackForm">
                                <div class="mb-3">
                                    <label for="bookingSelect" class="form-label">Select Booking</label>
                                    <select class="form-select" id="bookingSelect" required>
                                        <option value="">Choose a booking...</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Rating</label>
                                    <div class="rating mb-3">
                                        <input type="radio" name="rating" value="5" id="star5">
                                        <label for="star5"><i class="fas fa-star"></i></label>

                                        <input type="radio" name="rating" value="4" id="star4">
                                        <label for="star4"><i class="fas fa-star"></i></label>

                                        <input type="radio" name="rating" value="3" id="star3">
                                        <label for="star3"><i class="fas fa-star"></i></label>

                                        <input type="radio" name="rating" value="2" id="star2">
                                        <label for="star2"><i class="fas fa-star"></i></label>

                                        <input type="radio" name="rating" value="1" id="star1">
                                        <label for="star1"><i class="fas fa-star"></i></label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="feedbackMessage" class="form-label">Your Feedback</label>
                                    <textarea class="form-control" id="feedbackMessage" rows="4" placeholder="Share your experience..."></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">Submit Feedback</button>
                            </form>
                            <div id="feedbackMessage" class="mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- Rating Summary -->
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5>Venue Ratings</h5>
                        </div>
                        <div class="card-body">
                            <div id="ratingsSummary">
                                <!-- Ratings will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- All Feedback -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5>All Feedbacks</h5>
                        </div>
                        <div class="card-body">
                            <div id="allFeedback">
                                <!-- Feedback will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2026 Smart Event Venue Booking System. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadUserBookings();
            loadAllFeedback();
        });
    </script>
</body>
</html>
