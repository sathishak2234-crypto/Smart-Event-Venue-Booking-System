<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Event Venue Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --ink: #14213d;
            --muted: #566173;
            --accent: #0d6efd;
            --accent-dark: #0a58ca;
            --border: #dbe4f0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 10% 10%, #dbeafe 0, transparent 40%),
                        radial-gradient(circle at 80% 20%, #bfdbfe 0, transparent 35%),
                        var(--bg);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .admin-login-card {
            width: min(460px, 92vw);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(20, 33, 61, 0.12);
            overflow: hidden;
        }

        .card-top {
            padding: 1.5rem 1.7rem;
            background: linear-gradient(135deg, #0d6efd, #4f46e5);
            color: #fff;
        }

        .card-top h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .card-top p {
            margin: 0.35rem 0 0 0;
            opacity: 0.9;
            font-size: 0.92rem;
        }

        .card-body {
            padding: 1.4rem 1.7rem 1.7rem;
        }

        .form-label {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .form-control {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.62rem 0.85rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.2);
            border-color: var(--accent);
        }

        .btn-admin {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            padding: 0.7rem 1rem;
            transition: background 0.2s ease;
        }

        .btn-admin:hover {
            background: var(--accent-dark);
        }

        .helper-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .helper-links a {
            color: var(--accent-dark);
            text-decoration: none;
            font-weight: 600;
        }

        .helper-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="admin-login-card">
        <div class="card-top">
            <h1><i class="fas fa-user-shield me-2"></i>Admin Login</h1>
            <p>Sign in to manage users, vendors, venues, bookings, and notifications.</p>
        </div>
        <div class="card-body">
            <form id="adminLoginForm">
                <div class="mb-3">
                    <label for="adminEmail" class="form-label">Admin Email</label>
                    <input type="email" id="adminEmail" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="adminPassword" class="form-label">Password</label>
                    <input type="password" id="adminPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn-admin">Login to Admin Panel</button>
            </form>
            <div id="adminLoginAlert" class="mt-3"></div>
            <div class="helper-links">
                <a href="login.html">User Login</a>
                <a href="index.html">Home</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = (window.API_BASE_URL || localStorage.getItem('apiBaseUrl') || 'http://localhost:5000/api').replace(/\/$/, '');

        function showAlert(message, type = 'danger') {
            const container = document.getElementById('adminLoginAlert');
            container.innerHTML = `<div class="alert alert-${type} mb-0">${message}</div>`;
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.message || 'Login failed');
                }

                if (!result.user || !result.user.is_admin) {
                    throw new Error('This account is not an admin account.');
                }

                localStorage.setItem('adminAuthToken', result.token);
                localStorage.setItem('currentAdminUser', JSON.stringify(result.user));
                showAlert('Admin login successful. Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 700);
            } catch (error) {
                showAlert(error.message || 'Unable to login.');
            }
        });
    </script>
</body>
</html>
